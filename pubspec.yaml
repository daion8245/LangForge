name: langforge
description: "LangForge — Local Desktop Minecraft Localization Tool"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Local DB
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # Security & Storage
  flutter_secure_storage: ^10.3.1

  # Archive & HTTP
  archive: ^4.0.9
  dio: ^5.11.0

  # Desktop & UI Tools
  file_picker: ^11.0.3
  desktop_drop: ^0.7.1
  window_manager: ^0.5.2
  lucide_icons_flutter: ^3.1.15

  # Utilities
  path: ^1.9.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  uuid: ^4.6.0
  http: ^1.2.1
  unorm_dart: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  drift_dev: ^2.34.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/fonts/
    - assets/icons/
    - assets/pack/

  fonts:
    - family: IBM Plex Sans KR
      fonts:
        - asset: assets/fonts/IBMPlexSansKR-Regular.ttf
        - asset: assets/fonts/IBMPlexSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansKR-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
